[package]
name = "bitdexter"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A Bitcoin indexer that syncs over P2P and serves an Esplora-compatible API"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bitcoin = { version = "0.32.102", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
hex = "0.4.3"
libc = "0.2.190"
lmdb-master-sys = "0.2.6"
memmap2 = "0.9.12"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "io-util", "time", "fs"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
